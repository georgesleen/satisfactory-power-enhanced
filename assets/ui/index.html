<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power building menus</title>
<link rel="stylesheet" href="menu.css">
<script src="wasm/core.js" defer></script>
<script src="menu.js" defer></script>
</head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="window" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 8h18M7 3v5"/></symbol>
<symbol id="check" viewBox="0 0 32 32"><path d="M25 6a13 13 0 1 0 4 10M9 15l6 6L29 7"/></symbol>
<symbol id="bolt" viewBox="0 0 24 24"><path d="m14 2-8 12h6l-2 8 8-12h-6z"/></symbol>
<symbol id="arrow" viewBox="0 0 32 32"><path d="M3 11h15V4l12 12-12 12v-7H3z"/></symbol>
<symbol id="heat" viewBox="0 0 24 24"><path d="M9 5a3 3 0 0 1 6 0v9a5 5 0 1 1-6 0zM12 7v11"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 6v1"/></symbol>
<symbol id="warning" viewBox="0 0 32 32"><path d="M16 3 30 28H2zM16 10v10M16 23v2"/></symbol>
<symbol id="snow" viewBox="0 0 32 32"><path d="M16 2v28M4 9l24 14M4 23 28 9M11 5l5 5 5-5M11 27l5-5 5 5M4 15l7-2-1-7M28 17l-7 2 1 7M4 17l7 2-1 7M28 15l-7-2 1-7"/></symbol>
<symbol id="storage" viewBox="0 0 32 32"><rect x="3" y="7" width="24" height="18" rx="2"/><path d="M27 12h3v8h-3M10 11v10M16 11v10M22 11v10"/></symbol>
</defs></svg>
<nav class="preview-toolbar" aria-label="Preview controls">
<div class="preview-picker"><button id="building-picker" aria-expanded="false" aria-controls="building-options">Building: <span>Transformer</span><b aria-hidden="true">&#9662;</b></button><div id="building-options" class="picker-options" hidden><button data-building="transformer">Transformer</button><button data-building="capacitor">Capacitor bank</button><button data-building="cryo">Cryo station</button><button data-building="pole">Power pole</button></div></div>
<div class="preview-picker"><button id="scenario-picker" aria-expanded="false" aria-controls="scenario-options">Scenario: <span>Normal supply</span><b aria-hidden="true">&#9662;</b></button><div id="scenario-options" class="picker-options" hidden><button data-scenario="0">Normal supply</button><button data-scenario="5">Sustained overload</button><button data-scenario="2">Pulsed load</button><button data-scenario="3">Upstream outage</button><button data-scenario="4">Empty grid</button><button data-scenario="1">Thermal test (imposed load)</button></div></div>
<button id="pause" disabled>Pause</button><button id="restart" disabled>Restart</button>
<span id="preview-status">Loading real C++ core...</span>
</nav>
<main class="interaction-window" aria-labelledby="building-name" hidden>
<header class="window-header"><svg aria-hidden="true"><use href="#window"/></svg><h1 id="building-name">Transformer</h1><button class="close" aria-label="Close building menu">&times;</button></header>
<div class="equipment-body"><section class="operation-column" aria-label="Building controls"></section><section class="circuit-column" aria-label="Building instruments"></section></div>
<div class="condition-strip"><svg aria-hidden="true"><use href="#info"/></svg><p id="condition"></p></div>
<details class="technical"><summary>Transformer details</summary><div id="technical-content"></div></details>
</main>
<button id="reopen" hidden>Open building menu</button>
<aside class="review-note">BROWSER PROTOTYPE<span id="runtime-note">Real core simulation. No game connection.</span></aside>
</body>
</html>
